<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Background Chip Gradient -->
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e222a"/>
      <stop offset="50%" stop-color="#16181e"/>
      <stop offset="100%" stop-color="#0f1115"/>
    </linearGradient>

    <!-- Metallic Rim Gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ec9b0"/>
      <stop offset="35%" stop-color="#3b4048"/>
      <stop offset="70%" stop-color="#282c34"/>
      <stop offset="100%" stop-color="#61afef"/>
    </linearGradient>

    <!-- Gold Pin Gradient -->
    <linearGradient id="goldPinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd56b"/>
      <stop offset="60%" stop-color="#d19a66"/>
      <stop offset="100%" stop-color="#b07b3e"/>
    </linearGradient>

    <!-- Core Die Gradient -->
    <linearGradient id="coreDieGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#21252b"/>
      <stop offset="100%" stop-color="#14171a"/>
    </linearGradient>

    <!-- Electric Lightning Forge Gradient -->
    <linearGradient id="forgeSpark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd56b"/>
      <stop offset="30%" stop-color="#4ec9b0"/>
      <stop offset="85%" stop-color="#61afef"/>
      <stop offset="100%" stop-color="#00adb5"/>
    </linearGradient>

    <!-- Filter for subtle glow -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- PINS (16 gold IC pins around perimeter) -->
  <!-- Top pins -->
  <rect x="58" y="8" width="16" height="24" rx="3" fill="url(#goldPinGrad)"/>
  <rect x="94" y="8" width="16" height="24" rx="3" fill="url(#goldPinGrad)"/>
  <rect x="146" y="8" width="16" height="24" rx="3" fill="url(#goldPinGrad)"/>
  <rect x="182" y="8" width="16" height="24" rx="3" fill="url(#goldPinGrad)"/>

  <!-- Bottom pins -->
  <rect x="58" y="224" width="16" height="24" rx="3" fill="url(#goldPinGrad)"/>
  <rect x="94" y="224" width="16" height="24" rx="3" fill="url(#goldPinGrad)"/>
  <rect x="146" y="224" width="16" height="24" rx="3" fill="url(#goldPinGrad)"/>
  <rect x="182" y="224" width="16" height="24" rx="3" fill="url(#goldPinGrad)"/>

  <!-- Left pins -->
  <rect x="8" y="58" width="24" height="16" rx="3" fill="url(#goldPinGrad)"/>
  <rect x="8" y="94" width="24" height="16" rx="3" fill="url(#goldPinGrad)"/>
  <rect x="8" y="146" width="24" height="16" rx="3" fill="url(#goldPinGrad)"/>
  <rect x="8" y="182" width="24" height="16" rx="3" fill="url(#goldPinGrad)"/>

  <!-- Right pins -->
  <rect x="224" y="58" width="24" height="16" rx="3" fill="url(#goldPinGrad)"/>
  <rect x="224" y="94" width="24" height="16" rx="3" fill="url(#goldPinGrad)"/>
  <rect x="224" y="146" width="24" height="16" rx="3" fill="url(#goldPinGrad)"/>
  <rect x="224" y="182" width="24" height="16" rx="3" fill="url(#goldPinGrad)"/>

  <!-- MAIN CHIP BODY (208 x 208, rounded rect) -->
  <rect x="24" y="24" width="208" height="208" rx="28" fill="url(#chipGrad)" stroke="url(#rimGrad)" stroke-width="4"/>

  <!-- Pin 1 index dot / notch -->
  <circle cx="48" cy="48" r="6" fill="#282c34" stroke="#3e4451" stroke-width="1.5"/>

  <!-- PCB CIRCUIT TRACES -->
  <g stroke="#282c34" stroke-width="2.5" fill="none" stroke-linecap="round">
    <path d="M 66 32 L 66 56 L 86 76"/>
    <path d="M 190 32 L 190 56 L 170 76"/>
    <path d="M 32 66 L 56 66 L 76 86"/>
    <path d="M 224 66 L 200 66 L 180 86"/>
    <path d="M 32 190 L 56 190 L 76 170"/>
    <path d="M 224 190 L 200 190 L 180 170"/>
    <path d="M 66 224 L 66 200 L 86 180"/>
    <path d="M 190 224 L 190 200 L 170 180"/>
  </g>
  <g stroke="#00adb5" stroke-width="1.5" opacity="0.4" fill="none">
    <path d="M 66 32 L 66 52 L 82 68"/>
    <path d="M 190 224 L 190 204 L 174 188"/>
  </g>

  <!-- CENTRAL CPU DIE (Chamfered Anvil / Silicon Die) -->
  <rect x="58" y="58" width="140" height="140" rx="16" fill="url(#coreDieGrad)" stroke="#3e4451" stroke-width="2.5"/>
  <rect x="64" y="64" width="128" height="128" rx="12" fill="none" stroke="#4ec9b0" stroke-width="1" opacity="0.3"/>

  <!-- STYLIZED ANVIL BASE -->
  <path d="M 80 162 L 176 162 L 168 152 L 152 148 L 104 148 L 88 152 Z" fill="#2c313a" stroke="#4ec9b0" stroke-width="1.5"/>

  <!-- BITFORGE LIGHTNING / SPARK EMBLEM (Vibrant Central Icon) -->
  <polygon points="138,72 102,118 128,118 116,156 156,108 130,108"
           fill="url(#forgeSpark)"
           stroke="#e5c07b"
           stroke-width="1.5"
           stroke-linejoin="round"
           filter="url(#cyanGlow)"/>

  <!-- 8-BIT BUS LEDS (Representing the 8-bit architecture) -->
  <!-- Binary pattern 10110101 (0xB5): Teal for 1, Dark for 0 -->
  <g transform="translate(74, 174)">
    <circle cx="0" cy="0" r="3.5" fill="#4ec9b0"/>
    <circle cx="15" cy="0" r="3.5" fill="#282c34"/>
    <circle cx="30" cy="0" r="3.5" fill="#4ec9b0"/>
    <circle cx="45" cy="0" r="3.5" fill="#4ec9b0"/>
    <circle cx="60" cy="0" r="3.5" fill="#282c34"/>
    <circle cx="75" cy="0" r="3.5" fill="#4ec9b0"/>
    <circle cx="90" cy="0" r="3.5" fill="#282c34"/>
    <circle cx="105" cy="0" r="3.5" fill="#4ec9b0"/>
  </g>
</svg>
